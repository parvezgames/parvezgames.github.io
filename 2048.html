<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - Parvez Games</title>
<style>
  body{margin:0;background:#0f0f13;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
  h1{margin:10px 0}
  #score{font-size:20px;margin-bottom:15px}
  #grid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;background:#1a1a22;padding:10px;border-radius:12px}
  .cell{width:80px;height:80px;background:#2a2a35;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold}
  .c2{background:#eee4da;color:#776e65}.c4{background:#ede0c8;color:#776e65}
  .c8{background:#f2b179;color:white}.c16{background:#f59563;color:white}
  .c32{background:#f67c5f;color:white}.c64{background:#f65e3b;color:white}
  .c128{background:#edcf72;color:white}.c256{background:#edcc61;color:white}
  .c512{background:#edc850;color:white}.c1024{background:#edc53f;color:white}
  .c2048{background:#edc22e;color:white}
  button{margin-top:20px;padding:12px 25px;border:none;border-radius:25px;background:#00bfff;color:black;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
  <h1>2048</h1>
  <div id="score">Score: 0</div>
  <div id="grid"></div>
  <button onclick="init()">New Game</button>
  <p style="margin-top:15px;color:#888">Use Arrow Keys</p>

<script>
let grid, score;
function init(){
  grid = Array(4).fill().map(()=>Array(4).fill(0));
  score = 0;
  add(); add();
  draw();
}
function add(){
  let empty=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empty.push([r,c]);
  if(empty.length){
    let [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random()<0.9 ? 2 : 4;
  }
}
function draw(){
  document.getElementById("score").textContent = "Score: "+score;
  const g = document.getElementById("grid");
  g.innerHTML = "";
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const d = document.createElement("div");
    d.className = "cell" + (grid[r][c] ? " c"+grid[r][c] : "");
    d.textContent = grid[r][c] || "";
    g.appendChild(d);
  }
}
function slide(row){
  let arr = row.filter(x=>x);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
  }
  while(arr.length<4) arr.push(0);
  return arr;
}
function move(dir){
  let old = JSON.stringify(grid);
  if(dir==="left") grid = grid.map(slide);
  if(dir==="right") grid = grid.map(r=>slide(r.reverse()).reverse());
  if(dir==="up"){
    for(let c=0;c<4;c++){
      let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
      col = slide(col);
      for(let r=0;r<4;r++) grid[r][c]=col[r];
    }
  }
  if(dir==="down"){
    for(let c=0;c<4;c++){
      let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]].reverse();
      col = slide(col).reverse();
      for(let r=0;r<4;r++) grid[r][c]=col[r];
    }
  }
  if(JSON.stringify(grid)!==old){ add(); draw(); }
}
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") move("left");
  if(e.key==="ArrowRight") move("right");
  if(e.key==="ArrowUp") move("up");
  if(e.key==="ArrowDown") move("down");
});
init();
</script>
</body>
</html>
